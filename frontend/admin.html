<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIKABH | Client Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#183d39;background:#f0ebe6;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{height:76px;background:#004c48;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font:800 26px 'Manrope',sans-serif;color:white}.top-right{display:flex;align-items:center;gap:20px;color:#d0e3df;font-size:13px}.avatar{width:38px;height:38px;border-radius:50%;background:#08bd60;color:#004c48;display:grid;place-items:center;font-weight:700}.logout{border:1px solid #6c9590;background:transparent;color:white;border-radius:5px;padding:8px 12px;font:600 12px 'DM Sans',sans-serif;cursor:pointer}.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 76px)}.side{background:#004c48;color:#b7d1cc;padding:25px 14px}.side-label{font-size:10px;letter-spacing:1.1px;font-weight:700;margin:0 12px 14px;color:#7ca8a1}.nav-item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:26px;background:#08635a;color:#fff;font-size:13px;font-weight:700}.nav-mark{width:19px;height:19px;border:2px solid #08bd60;border-radius:4px;display:grid;place-items:center;font-size:12px;color:#08bd60}.main{padding:32px clamp(20px,3.2vw,50px);min-width:0}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.heading h1{font:800 29px 'Manrope',sans-serif;color:#064d48;margin:0}.heading p{font-size:13px;color:#72817e;margin:5px 0 0}.join{border:1px solid #a9bbb6;background:#f7f4f0;color:#07564e;border-radius:5px;padding:10px 14px;font:700 12px 'DM Sans',sans-serif}.stats{display:flex;gap:32px;margin-bottom:20px;color:#74827e;font-size:12px}.stats strong{display:block;color:#173d39;font-size:18px;margin-top:3px}.table-wrap{background:white;border:1px solid #e0e5e1;border-radius:8px;overflow:auto;box-shadow:0 3px 12px rgba(20,61,55,.04)}table{width:100%;border-collapse:collapse;min-width:680px}thead{background:#004c48;color:white}th{text-align:left;padding:15px 17px;font-size:11px;font-weight:700}td{padding:14px 17px;border-bottom:1px solid #e9eeeb;color:#52625f;font-size:13px}tbody tr:last-child td{border-bottom:0}.client-name{color:#173d39;font-weight:700}.muted{font-size:11px;color:#929f9b;margin-top:3px}.value{text-align:right;font-variant-numeric:tabular-nums;color:#173d39;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:7px}.action{border:1px solid #adc1bb;background:#fff;color:#07564e;border-radius:4px;padding:7px 9px;font:700 11px 'DM Sans',sans-serif;cursor:pointer}.action.primary{border-color:#08a956;background:#08a956;color:#fff}.empty{padding:50px 20px;text-align:center;color:#74827e;font-size:13px}.state{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#07864c}.state:before{content:'';width:7px;height:7px;border-radius:50%;background:#08bd60}.state.pending{color:#8a6b33}.state.pending:before{background:#d3a73e}#notice{font-size:12px;color:#9b3d35;margin:12px 0}
dialog{width:min(420px,calc(100% - 30px));border:1px solid #dce4df;border-radius:8px;padding:26px;color:#183d39;box-shadow:0 18px 50px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(0,38,34,.42)}dialog h2{font:700 20px 'Manrope',sans-serif;margin:0 0 5px}dialog p{font-size:12px;color:#778681;margin:0 0 18px}.dialog-field{display:grid;gap:6px;margin:12px 0}.dialog-field label{font-size:12px;font-weight:700}.dialog-field input{height:42px;border:1px solid #ced9d4;border-radius:4px;padding:0 10px;font:14px 'DM Sans',sans-serif}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:740px){.top{padding:0 18px}.shell{grid-template-columns:1fr}.side{display:none}.main{padding:25px 16px}.heading{align-items:flex-start;flex-direction:column}.stats{gap:22px}.top-right{gap:10px}}
</style>
</head>
<body>
<header class="top"><div class="brand">VIKABH</div><div class="top-right"><span>Client Portal · Administrator</span><button class="logout" onclick="signOut()">Sign out</button><div class="avatar">A</div></div></header>
<div class="shell"><aside class="side"><div class="side-label">NAVIGATION</div><div class="nav-item"><span class="nav-mark">▦</span>Client Directory</div></aside>
<main class="main"><div class="heading"><div><h1>Clients</h1><p>Portfolio accounts and current market values</p></div></div>
<div class="stats"><div>CLIENTS<strong id="client-count">—</strong></div><div>PORTFOLIO VALUE<strong id="total-value">—</strong></div></div><div id="notice" role="alert"></div>
<div class="table-wrap"><table><thead><tr><th>Client</th><th>Portfolio</th><th>Holdings</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody id="client-rows"><tr><td colspan="5" class="empty">Loading client records…</td></tr></tbody></table></div>
</main></div>
<script>
const fmt=value=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(value||0);
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
async function loadDirectory(){try{const me=await fetch('/api/auth/me');if(!me.ok){location.replace('login.html');return}const user=await me.json();if(user.role!=='admin'){location.replace(user.has_uploads?`dashboard.html?client_id=${user.client_id}`:'upload.html');return}const response=await fetch('/api/client/');if(!response.ok)throw new Error((await response.json()).detail||'Could not load clients.');const clients=await response.json();document.getElementById('client-count').textContent=clients.length;document.getElementById('total-value').textContent=fmt(clients.reduce((sum,c)=>sum+(c.portfolio_value||0),0));const rows=document.getElementById('client-rows');rows.innerHTML=clients.length?clients.map(client=>`<tr><td><div class="client-name">${escapeHtml(client.name)}</div><div class="muted">${escapeHtml(client.email||'')}</div></td><td class="value">${fmt(client.portfolio_value)}</td><td>${client.holding_count||0}</td><td><span class="state ${client.has_uploads?'':'pending'}">${client.has_uploads?'Portfolio ready':'Awaiting upload'}</span></td><td><div class="actions">${client.has_uploads?`<button class="action primary" onclick="openDashboard(${client.id})">Dashboard</button>`:''}<button class="action" onclick="openUpload(${client.id})">${client.has_uploads?'Add files':'Upload files'}</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No clients have registered yet.</td></tr>'}catch(error){document.getElementById('notice').textContent=error.message;document.getElementById('client-rows').innerHTML='<tr><td colspan="5" class="empty">Unable to load the client directory.</td></tr>'}}
function openDashboard(id){location.href=`dashboard.html?client_id=${id}`}
function openUpload(id){location.href=`upload.html?client_id=${id}`}
async function signOut(){await fetch('/api/auth/logout',{method:'POST'});location.href='login.html'}
loadDirectory();
</script>
</body>
</html>
