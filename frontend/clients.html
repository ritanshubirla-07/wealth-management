<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIKABH — Clients</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',system-ui,sans-serif;background:#ffffff;color:#1e293b;line-height:1.5}
.app{display:flex;min-height:100vh}

/* ═══════════════════════ SIDEBAR (Dark Navy) ═══════════════════════ */
.sb{width:195px;background:#0b1628;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;overflow-y:auto}
.sb-logo{padding:22px 16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo-r{display:flex;align-items:center;gap:9px}
.sb-logo-ic{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#10b981);border-radius:9px;display:flex;align-items:center;justify-content:center}
.sb-logo-ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2}
.sb-logo h2{font-size:14.5px;font-weight:700;color:#fff;line-height:1.15}
.sb-logo small{font-size:9.5px;color:#f97316;font-weight:500;letter-spacing:.3px}
.sb-nav{flex:1;padding:14px 10px}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.55);font-size:13px;font-weight:500;text-decoration:none;margin-bottom:2px;cursor:pointer;transition:.15s}
.sb-nav a:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.sb-nav a.act{background:#1d3a6b;color:#fff}
.sb-nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}
.sb-ft{padding:12px 10px;border-top:1px solid rgba(255,255,255,.08)}
.sb-adv{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
.sb-av{width:32px;height:32px;border-radius:50%;background:#1d3a6b;display:flex;align-items:center;justify-content:center}
.sb-av svg{width:15px;height:15px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:1.8}
.sb-an{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.9)}
.sb-ar{font-size:9.5px;color:rgba(255,255,255,.4)}

/* ═══════════════════════ MAIN ═══════════════════════ */
.mn{margin-left:195px;flex:1;padding:22px 26px 28px;min-height:100vh}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.hdr h1{font-size:22px;font-weight:700;color:#0f172a;letter-spacing:-.3px}
.hdr p{font-size:12px;color:#94a3b8;margin-top:1px}

.btn-primary {
    background: #2563eb; color: #fff; padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s; font-family: inherit; display: flex; align-items: center; gap: 6px;
}
.btn-primary:hover { background: #1d4ed8; }
.btn-primary svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none; }

.clients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
.client-card { background: #fff; border: 1px solid #e8ecf1; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.04); cursor: pointer; transition: .2s; }
.client-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); border-color: #cbd5e1; }
.cc-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.cc-av { width: 40px; height: 40px; border-radius: 8px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.cc-name { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
.cc-id { font-size: 11px; color: #94a3b8; font-weight: 500; }
.cc-info { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #64748b; }
.cc-info div { display: flex; align-items: center; gap: 6px; }
.cc-info svg { width: 14px; height: 14px; stroke: #94a3b8; stroke-width: 2; fill: none; }

/* MODAL */
.modal-ovl { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 12px; width: 400px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,.1); animation: pop .2s ease-out; }
@keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.mod-hdr { padding: 18px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
.mod-hdr h3 { font-size: 16px; font-weight: 700; color: #0f172a; }
.mod-cl { cursor: pointer; color: #64748b; font-size: 20px; font-weight: 600; line-height: 1; }
.mod-cl:hover { color: #0f172a; }
.mod-bdy { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.fg { display: flex; flex-direction: column; gap: 6px; }
.fg label { font-size: 12px; font-weight: 600; color: #334155; }
.fg input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 13px; color: #1e293b; outline: none; }
.fg input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
.mod-ft { padding: 16px 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px; background: #f8fafc; border-radius: 0 0 12px 12px; }
.btn-sec { background: #fff; color: #475569; padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-sec:hover { background: #f1f5f9; }

</style>
</head>
<body>
<div class="app">

<aside class="sb">
  <div class="sb-logo">
    <div class="sb-logo-r">
      <div class="sb-logo-ic"><svg viewBox="0 0 24 24"><path d="M3 18L8 11L13 15L18 5L21 9"/></svg></div>
      <div><h2>VIKABH</h2><small>Wealth Intelligence</small></div>
    </div>
  </div>
  <nav class="sb-nav">
    <a class="act" href="clients.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Client Directory</a>
  </nav>
  <div class="sb-ft">
    <div class="sb-adv">
      <div class="sb-av"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div><div class="sb-an">Advisor</div><div class="sb-ar">Wealth Management</div></div>
    </div>
  </div>
</aside>

<main class="mn">
  <div class="hdr">
    <div><h1>Client Directory</h1><p>Manage your client portfolios and generate insights.</p></div>
    <button class="btn-primary" onclick="document.getElementById('modal').style.display='flex'">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New Client
    </button>
  </div>
  
  <div class="clients-grid" id="cgrid">
    <!-- Clients injected here -->
  </div>
</main>

</div>

<div class="modal-ovl" id="modal">
  <div class="modal">
    <div class="mod-hdr">
      <h3>Create New Client</h3>
      <div class="mod-cl" onclick="document.getElementById('modal').style.display='none'">×</div>
    </div>
    <div class="mod-bdy">
      <div class="fg">
        <label>Client Name / Family Name *</label>
        <input type="text" id="cname" placeholder="e.g. Shroff Family">
      </div>
    </div>
    <div class="mod-ft">
      <button class="btn-sec" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
      <button class="btn-primary" onclick="createClient()" id="cbtn">Create Client</button>
    </div>
  </div>
</div>

<script>
async function loadClients() {
  const res = await fetch('/api/client/');
  const clients = await res.json();
  const grid = document.getElementById('cgrid');
  grid.innerHTML = '';
  
  if (clients.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: #64748b; background: #fff; border-radius: 12px; border: 1px solid #e8ecf1;">No clients found. Click "New Client" to get started.</div>';
    return;
  }
  
  clients.forEach(c => {
    const inits = c.name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
    grid.innerHTML += `
      <div class="client-card" onclick="window.location.href='upload.html?client_id=${c.id}'">
        <div class="cc-hdr">
          <div>
            <div class="cc-name">${c.name}</div>
            <div class="cc-id">Client ID: #${c.id}</div>
          </div>
          <div class="cc-av">${inits}</div>
        </div>
        <div class="cc-info">
          <div><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Joined ${new Date(c.created_at).toLocaleDateString()}</div>
        </div>
      </div>
    `;
  });
}

async function createClient() {
  const name = document.getElementById('cname').value.trim();
  if(!name) return alert('Name is required');
  
  const btn = document.getElementById('cbtn');
  btn.innerText = 'Creating...';
  
  const payload = { name };
  
  const res = await fetch('/api/client/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  
  if(res.ok) {
    document.getElementById('modal').style.display='none';
    document.getElementById('cname').value = '';
    loadClients();
  } else {
    alert('Failed to create client');
  }
  btn.innerText = 'Create Client';
}

loadClients();
</script>
</body>
</html>
